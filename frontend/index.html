<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda-Chaves Digital — Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="imgs/icone_chave.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tela-login">
        <div class="cartao-login">
            <div class="marca">
                <img class="marca-icone" src="imgs/icone_chave2.png" alt="logo da Guarda-Chaves Digital">
                <h1>Guarda-Chaves Digital</h1>
            </div>
            <p class="tagline">Controle de empréstimo e devolução de chaves</p>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required autocomplete="username">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="botao-primario" id="botao-entrar">Entrar</button>

                <div class="mensagem" id="mensagem-login" role="alert"></div>
            </form>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
